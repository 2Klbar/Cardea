[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.85"
publish = false

[workspace.dependencies]
cardea-core = { path = "crates/core" }
cardea-proto = { path = "crates/proto" }
cardea-engine = { path = "crates/engine" }
cardea-daemon = { path = "crates/daemon" }
chrono = "0.4.45"
clap = { version = "4.6.9", features = ["derive"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
ksni = "0.3.7"
resvg = { version = "0.50.0", default-features = false }
rustix = { version = "1.1.6", features = ["fs", "net", "process", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
tempfile = "3.27.0"
tokio = "1.54.1"
url = "2.5.8"
zbus = { version = "5.13.2", default-features = false, features = ["tokio"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
