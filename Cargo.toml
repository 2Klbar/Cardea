[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.85"
publish = false

[workspace.dependencies]
cardea-core = { path = "crates/core" }
cardea-proto = { path = "crates/proto" }
cardea-engine = { path = "crates/engine" }
cardea-daemon = { path = "crates/daemon" }
chrono = "0.4.45"
clap = { version = "4.6.9", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
tempfile = "3.27.0"
tokio = "1.54.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
