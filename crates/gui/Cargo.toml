[package]
name = "cardea-gui"
description = "Cardea GUI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "cardea-gui"
path = "src/main.rs"

[dependencies]
cardea-core.workspace = true
cardea-proto.workspace = true
cardea-daemon.workspace = true
iced = { version = "0.14.0", features = ["tokio", "canvas"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "macros"] }

[lints]
workspace = true
